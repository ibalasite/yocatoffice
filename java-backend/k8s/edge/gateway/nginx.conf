# yocat-gateway — 單一入口（唯一對外 NodePort）。
#   /                → client 靜態（遊戲本體）                       root /srv/index.html
#   /assets/*        → client 美術/WebLLM                            root /srv/assets
#   /character/*     → yocat-character（NPC 大腦，代理 host vLLM）
#   /health          → yocat-character /health（client 用它決定走後端 or 瀏覽器模型）
#   會員 API 群       → yocat-office-backend-api:8080（Java/Spring Modulith）
#
# 設計：client 用同源相對路徑（BACKEND_URL=''），所以 /auth /wallet … /character 全打本入口 → 零 CORS。
server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # 靜態根目錄（gateway 映像內 /srv/index.html + /srv/assets/*）
    root /srv;

    # 美術 / WebLLM（長快取；WebGPU 模型靠 ../assets/webllm.js 載入）
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # client 的健康檢查 → 轉給 character 服務（回 200 表示 vLLM 活著 → client 走後端）
    location = /health {
        proxy_pass http://yocat-character:3001/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # NPC 大腦（LLM 生成可能耗時，放寬逾時）
    location ^~ /character/ {
        proxy_pass http://yocat-character:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 會員系統 API 群 → Java 後端（路徑不改寫；Java 端點本就無 /api 前綴）
    location ~ ^/(auth|wallet|entitlements|records|leaderboard|save|deposit)(/|$) {
        proxy_pass http://yocat-office-backend-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 首頁 → 遊戲本體
    location = / {
        try_files /index.html =404;
    }

    # 其餘靜態（字型等）；找不到回 404，不要誤導到 index
    location / {
        try_files $uri =404;
    }
}

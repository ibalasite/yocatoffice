<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <style>
    .t{fill:#0f2740} .mut{fill:#64748b} .mono{font-family:Consolas,'Courier New',monospace}
    .hd{font-size:12px;font-weight:700;fill:#1e293b} .c{font-size:10px;fill:#334155} .cm{font-size:9.5px;fill:#475569}
    .cell{fill:#fff;stroke:#e2e8f0} .name{font-size:11.5px;font-weight:700}
  </style>
  <rect width="1320" height="860" fill="#f8fafc"/>
  <text x="24" y="30" font-size="20" class="t" font-weight="700">yoCat Office — 建置 &amp; 部署對照（按圖索驥找每個環節）</text>
  <text x="24" y="50" font-size="12" class="mut">路徑相對 <project-root>/java-backend/　·　映像前綴 yocat-office-backend/　·　namespace yocat-office-backend-local　·　k3s=dockerd，imagePullPolicy:Never</text>

  <!-- header -->
  <g>
    <rect x="24" y="64" width="126" height="32" fill="#0f2740"/><text x="32" y="85" class="hd" fill="#fff">元件</text>
    <rect x="150" y="64" width="256" height="32" fill="#0f2740"/><text x="158" y="85" class="hd" fill="#fff">原始碼 / 內容</text>
    <rect x="406" y="64" width="300" height="32" fill="#0f2740"/><text x="414" y="85" class="hd" fill="#fff">映像 &amp; build（docker build）</text>
    <rect x="706" y="64" width="248" height="32" fill="#0f2740"/><text x="714" y="85" class="hd" fill="#fff">k8s manifest</text>
    <rect x="954" y="64" width="246" height="32" fill="#0f2740"/><text x="962" y="85" class="hd" fill="#fff">關鍵執行設定</text>
    <rect x="1200" y="64" width="96" height="32" fill="#0f2740"/><text x="1208" y="85" class="hd" fill="#fff">位址</text>
  </g>

  <!-- rows: y start 96, height 74 -->
  <!-- row1 gateway -->
  <g>
    <rect x="24" y="96" width="1272" height="74" class="cell"/>
    <rect x="24" y="96" width="126" height="74" fill="#e0f2fe" stroke="#e2e8f0"/>
    <text x="32" y="124" class="name" fill="#075985">① gateway</text><text x="32" y="140" class="cm">nginx 反向代理</text><text x="32" y="155" class="cm">+ 靜態 client</text>
    <text x="158" y="118" class="cm mono">k8s/edge/gateway/nginx.conf</text>
    <text x="158" y="134" class="cm mono">client/index.html（COPY）</text>
    <text x="158" y="150" class="cm mono">assets/（185M，COPY）</text>
    <text x="158" y="164" class="cm">路由見循序/拓撲圖</text>
    <text x="414" y="118" class="c mono">yocat-office-backend/gateway:local</text>
    <text x="414" y="134" class="cm mono">Dockerfile: k8s/edge/gateway/</text>
    <text x="414" y="150" class="cm">context=staged（assets hardlink）</text>
    <text x="414" y="164" class="cm mono">FROM nginx:1.27-alpine</text>
    <text x="714" y="124" class="c mono">overlays/local/gateway.yaml</text>
    <text x="714" y="142" class="cm">Deployment ×2 + Service</text>
    <text x="714" y="158" class="cm">（type NodePort）</text>
    <text x="962" y="124" class="c">port 80 → nodePort 30088</text>
    <text x="962" y="142" class="cm">probe httpGet / :80</text>
    <text x="962" y="158" class="cm">podAntiAffinity · 50m/64Mi</text>
    <text x="1208" y="130" class="c mono" fill="#075985">:30088</text><text x="1208" y="146" class="cm">唯一入口</text>
  </g>
  <!-- row2 api -->
  <g>
    <rect x="24" y="170" width="1272" height="78" class="cell"/>
    <rect x="24" y="170" width="126" height="78" fill="#eef2ff" stroke="#e2e8f0"/>
    <text x="32" y="198" class="name" fill="#3730a3">② api</text><text x="32" y="214" class="cm">Spring Modulith</text><text x="32" y="229" class="cm">7 BC 會員</text>
    <text x="158" y="192" class="cm mono">apps/api/**（原始碼）</text>
    <text x="158" y="208" class="cm mono">apps/api/target/</text>
    <text x="158" y="222" class="cm mono">yocat-office-backend-api.jar</text>
    <text x="158" y="238" class="cm">host mvn package 產出</text>
    <text x="414" y="192" class="c mono">…/api:local</text>
    <text x="414" y="208" class="cm mono">Dockerfile: docker/api/Dockerfile</text>
    <text x="414" y="222" class="cm">（multi-stage maven→jre-alpine）</text>
    <text x="414" y="238" class="cm">本次用最新 jar 的 runtime 映像</text>
    <text x="714" y="196" class="c mono">overlays/local/api-deployment.yaml</text>
    <text x="714" y="214" class="c mono">overlays/local/api-service.yaml</text>
    <text x="714" y="232" class="cm">Deployment ×2 + Service(ClusterIP)</text>
    <text x="962" y="192" class="c">ClusterIP :8080</text>
    <text x="962" y="208" class="cm">envFrom cm+secret</text>
    <text x="962" y="222" class="cm">probe /health/ready · /health/live</text>
    <text x="962" y="238" class="cm">preStop sleep5 · grace60s</text>
    <text x="1208" y="204" class="c mono">svc:8080</text><text x="1208" y="220" class="cm">僅叢集內</text>
  </g>
  <!-- row3 character -->
  <g>
    <rect x="24" y="248" width="1272" height="78" class="cell"/>
    <rect x="24" y="248" width="126" height="78" fill="#fff7ed" stroke="#e2e8f0"/>
    <text x="32" y="276" class="name" fill="#9a3412">③ character</text><text x="32" y="292" class="cm">NPC 大腦</text><text x="32" y="307" class="cm">LLM 代理</text>
    <text x="158" y="276" class="cm mono">k8s/edge/character/</text>
    <text x="158" y="292" class="cm mono">server.js（Node，零依賴）</text>
    <text x="158" y="308" class="cm">移植自 server/src/index.ts</text>
    <text x="414" y="276" class="c mono">…/character:local</text>
    <text x="414" y="292" class="cm mono">Dockerfile: k8s/edge/character/</text>
    <text x="414" y="308" class="cm mono">FROM node:20-alpine</text>
    <text x="714" y="282" class="c mono">overlays/local/character.yaml</text>
    <text x="714" y="300" class="cm">Deployment ×1 + Service(ClusterIP)</text>
    <text x="962" y="276" class="c">ClusterIP :3001 · probe tcp</text>
    <text x="962" y="292" class="cm mono">LLM_BASE=host.docker.internal:8000/v1</text>
    <text x="962" y="308" class="cm mono">LLM_MODEL=Qwen2.5-7B-Instruct-AWQ</text>
    <text x="1208" y="282" class="c mono">svc:3001</text><text x="1208" y="298" class="cm">僅叢集內</text>
  </g>
  <!-- row4 redis -->
  <g>
    <rect x="24" y="326" width="1272" height="54" class="cell"/>
    <rect x="24" y="326" width="126" height="54" fill="#fef2f2" stroke="#e2e8f0"/>
    <text x="32" y="352" class="name" fill="#991b1b">④ redis</text><text x="32" y="368" class="cm">rate-limit/快取</text>
    <text x="158" y="357" class="cm">—（官方映像）</text>
    <text x="414" y="357" class="c mono">redis:7.2（docker.io 拉取）</text>
    <text x="714" y="357" class="c mono">overlays/local/redis.yaml</text>
    <text x="962" y="357" class="c">Deployment ×1 · ClusterIP :6379</text>
    <text x="1208" y="357" class="c mono">svc:6379</text>
  </g>
  <!-- row5 flyway -->
  <g>
    <rect x="24" y="380" width="1272" height="66" class="cell"/>
    <rect x="24" y="380" width="126" height="66" fill="#f0fdfa" stroke="#e2e8f0"/>
    <text x="32" y="406" class="name" fill="#0f766e">⑤ flyway</text><text x="32" y="422" class="cm">DB 遷移 Job</text><text x="32" y="437" class="cm">(一次性)</text>
    <text x="158" y="404" class="cm mono">migrations/V001–V013.sql</text>
    <text x="158" y="420" class="cm">→ cm flyway-migrations</text>
    <text x="158" y="436" class="cm mono">kubectl create configmap --from-file</text>
    <text x="414" y="410" class="c mono">flyway/flyway:10-alpine</text>
    <text x="414" y="428" class="cm">args: migrate</text>
    <text x="714" y="410" class="c mono">overlays/local/flyway-migration-job.yaml</text>
    <text x="714" y="428" class="cm">Job + volume cm(flyway-migrations)</text>
    <text x="962" y="404" class="cm mono">FLYWAY_URL=…yocat-pg…/yocat</text>
    <text x="962" y="420" class="cm mono">SCHEMAS=platform · 史表 schema_migrations</text>
    <text x="962" y="436" class="cm">baseline-on-migrate · create-schemas</text>
    <text x="1208" y="416" class="cm">—</text>
  </g>
  <!-- row6 ingress -->
  <g>
    <rect x="24" y="446" width="1272" height="50" class="cell"/>
    <rect x="24" y="446" width="126" height="50" fill="#fefce8" stroke="#e2e8f0"/>
    <text x="32" y="472" class="name" fill="#854d0e">⑥ ingress</text><text x="32" y="488" class="cm">Traefik</text>
    <text x="158" y="475" class="cm">—（k3s 內建 Traefik）</text>
    <text x="414" y="475" class="c">—</text>
    <text x="714" y="475" class="c mono">overlays/local/ingress.yaml</text>
    <text x="962" y="475" class="c mono">host yocat-office-backend.local · / → gateway:80</text>
    <text x="1208" y="475" class="c mono">:80</text>
  </g>
  <!-- row7 config -->
  <g>
    <rect x="24" y="496" width="1272" height="58" class="cell"/>
    <rect x="24" y="496" width="126" height="58" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="32" y="522" class="name" fill="#334155">⑦ 設定</text><text x="32" y="538" class="cm">cm + secret</text>
    <text x="158" y="520" class="cm mono">overlays/local/secrets.env</text>
    <text x="158" y="536" class="cm">kustomization literals</text>
    <text x="414" y="528" class="c">—（kustomize 產生，disableNameSuffixHash）</text>
    <text x="714" y="528" class="c mono">overlays/local/kustomization.yaml</text>
    <text x="962" y="520" class="cm mono">cm …-api-config（DB_HOST/REDIS…）</text>
    <text x="962" y="536" class="cm mono">secret …-api-secret（DB_PASSWORD…）</text>
    <text x="1208" y="528" class="cm">—</text>
  </g>
  <!-- row8 external -->
  <g>
    <rect x="24" y="554" width="1272" height="66" class="cell"/>
    <rect x="24" y="554" width="126" height="66" fill="#faf5ff" stroke="#e2e8f0"/>
    <text x="32" y="580" class="name" fill="#5b21b6">⑧ 外部</text><text x="32" y="596" class="cm">host vLLM</text><text x="32" y="611" class="cm">+ postgres</text>
    <text x="158" y="594" class="cm">yocat-pg 既有（ns yocat, 22h）</text>
    <text x="158" y="610" class="cm">vLLM pod 可達已驗證</text>
    <text x="414" y="578" class="c mono">vLLM Qwen2.5-7B-Instruct-AWQ</text>
    <text x="414" y="596" class="c mono">postgres:16（yocat-pg）</text>
    <text x="414" y="612" class="cm">非本 overlay 管理</text>
    <text x="714" y="586" class="cm">vLLM：host 行程（非 k8s）</text>
    <text x="714" y="604" class="cm mono">postgres：ns yocat 既有 Deployment</text>
    <text x="962" y="578" class="cm mono">vLLM :8000（OpenAI 相容）</text>
    <text x="962" y="594" class="cm mono">yocat-pg :5432 db=yocat user=yocat</text>
    <text x="962" y="610" class="cm">character/api/flyway 連它</text>
    <text x="1208" y="582" class="cm mono">host:8000</text><text x="1208" y="600" class="cm mono">pg:30432</text>
  </g>

  <!-- deploy order flow -->
  <text x="24" y="656" font-size="14" class="t" font-weight="700">部署順序（一鍵）</text>
  <g font-size="10.5" class="mono">
    <rect x="24" y="668" width="150" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="34" y="686" fill="#075985">1. docker build ×3</text><text x="34" y="700" fill="#334155" font-size="9">api / character / gateway</text>
    <rect x="186" y="668" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="196" y="686" fill="#334155">2. create ns</text><text x="196" y="700" font-size="9" fill="#64748b">yocat-…-local</text>
    <rect x="348" y="668" width="188" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488"/><text x="358" y="686" fill="#0f766e">3. create cm flyway-migrations</text><text x="358" y="700" font-size="9" fill="#64748b">--from-file=migrations/</text>
    <rect x="548" y="668" width="170" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5"/><text x="558" y="686" fill="#3730a3">4. kubectl apply -k</text><text x="558" y="700" font-size="9" fill="#64748b">k8s/overlays/local/</text>
    <rect x="730" y="668" width="170" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488"/><text x="740" y="686" fill="#0f766e">5. flyway Job migrate</text><text x="740" y="700" font-size="9" fill="#64748b">V001–V013 → pg</text>
    <rect x="912" y="668" width="170" height="40" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="922" y="686" fill="#9a3412">6. rollout status</text><text x="922" y="700" font-size="9" fill="#64748b">api/char/gw/redis</text>
    <rect x="1094" y="668" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="1104" y="686" fill="#065f46">7. 開 http://127.0.0.1:30088</text><text x="1104" y="700" font-size="9" fill="#64748b">完整遊戲</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="174" y1="688" x2="184" y2="688" marker-end="url(#a)"/><line x1="336" y1="688" x2="346" y2="688" marker-end="url(#a)"/>
    <line x1="536" y1="688" x2="546" y2="688" marker-end="url(#a)"/><line x1="718" y1="688" x2="728" y2="688" marker-end="url(#a)"/>
    <line x1="900" y1="688" x2="910" y2="688" marker-end="url(#a)"/><line x1="1082" y1="688" x2="1092" y2="688" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker></defs>

  <text x="24" y="744" font-size="11.5" class="t" font-weight="700">驗證重點</text>
  <text x="24" y="764" font-size="10.5" class="c">• 單一入口：curl http://127.0.0.1:30088/（client）、/health（character→vLLM llm:up）、/auth/register（→api→pg）、/character/chat（→vLLM 真回覆）</text>
  <text x="24" y="782" font-size="10.5" class="c">• E2E（真實 Chrome）：後端模式 24 筆 /character 全 200 → WebLLM 載好切換後停止；在座率 85–90% ≥80%；零 console error</text>
  <text x="24" y="800" font-size="10.5" class="mut">• 注意：本環境 k3s=dockerd，nerdctl 無 buildkit 不可用 → 一律 docker build；映像落 dockerd store，k3s 直接取用（Never）。</text>
  <text x="24" y="818" font-size="10.5" class="mut">• flyway cm 沿用專案 make db-migrate 命令式做法（未納入 kustomization）；teardown 會清掉 schema-per-BC 資料表，重佈署須重跑遷移。</text>
</svg>

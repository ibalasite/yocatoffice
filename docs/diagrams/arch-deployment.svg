<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="920" viewBox="0 0 1300 920" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrP" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
  </defs>
  <style>
    .t{fill:#0f2740} .mut{fill:#64748b} .mono{font-family:Consolas,'Courier New',monospace}
    .h{font-weight:700} .lbl{font-size:10.5px;fill:#475569}
  </style>
  <rect width="1300" height="920" fill="#f8fafc"/>
  <text x="26" y="34" font-size="21" class="t h">yoCat Office — 部署拓撲（細節版）· 單一入口 http://127.0.0.1:30088</text>
  <text x="26" y="55" font-size="12.5" class="mut">k3s runtime = docker://29.1.3（cri-dockerd，映像在 dockerd store）· 所有 image imagePullPolicy: Never · manifest 路徑相對 java-backend/</text>

  <!-- ===== Browser ===== -->
  <rect x="24" y="76" width="276" height="250" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="162" y="100" font-size="15" class="h" fill="#065f46" text-anchor="middle">🌐 玩家瀏覽器</text>
  <rect x="42" y="114" width="240" height="88" rx="6" fill="#fff" stroke="#34d399"/>
  <text x="52" y="132" font-size="12.5" class="h" fill="#064e3b">client/index.html</text>
  <text x="52" y="149" class="lbl">BACKEND_URL='' → 同源相對路徑</text>
  <text x="52" y="164" class="lbl">GEN.mode: auto｜checkBackend() 打 /health</text>
  <text x="52" y="179" class="lbl">useBrowserGen()=WLLM載好&amp;實測OK</text>
  <text x="52" y="194" class="lbl">離座上限 maxAway()=floor(20%)</text>
  <rect x="42" y="212" width="240" height="100" rx="6" fill="#fff" stroke="#34d399"/>
  <text x="52" y="230" font-size="12.5" class="h" fill="#064e3b">WebLLM（assets/webllm.js）</text>
  <text x="52" y="247" class="lbl">import @mlc-ai/web-llm（esm.run）</text>
  <text x="52" y="262" class="lbl">CreateMLCEngine · WebGPU</text>
  <text x="52" y="277" class="lbl">Qwen2.5-1.5B-Instruct-q4f16_1-MLC</text>
  <text x="52" y="294" class="lbl">載好+probe成功→GEN.mode='browser'</text>
  <text x="52" y="308" class="lbl mut">切換後 NPC 在瀏覽器生成，零 server 呼叫</text>

  <!-- entry -->
  <line x1="300" y1="150" x2="372" y2="150" stroke="#0284c7" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="336" y="140" font-size="12" class="h" fill="#075985" text-anchor="middle">:30088</text>
  <text x="336" y="176" font-size="9.5" class="mut" text-anchor="middle">NodePort / Traefik:80</text>

  <!-- ===== k3s cluster ===== -->
  <rect x="372" y="72" width="690" height="828" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="388" y="94" font-size="13.5" class="h" fill="#334155">☸ k3s 叢集 · namespace: yocat-office-backend-local</text>
  <text x="388" y="110" class="lbl">kustomization.yaml（namespace / configMapGenerator / secretGenerator / disableNameSuffixHash:true）</text>

  <!-- gateway -->
  <rect x="392" y="124" width="650" height="196" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="404" y="146" font-size="15" class="h" fill="#075985">① yocat-gateway　（Deployment ×2 · Service NodePort）</text>
  <text x="404" y="165" class="lbl mono">image yocat-office-backend/gateway:local　port 80→nodePort 30088　probe httpGet / :80</text>
  <text x="404" y="180" class="lbl mono">manifest k8s/overlays/local/gateway.yaml　｜　Dockerfile+nginx.conf: k8s/edge/gateway/</text>
  <text x="404" y="195" class="lbl mono">映像內容：nginx:1.27-alpine + COPY assets/(185M) + client/index.html + nginx.conf</text>
  <line x1="404" y1="204" x2="1030" y2="204" stroke="#7dd3fc"/>
  <text x="404" y="222" font-size="12" class="h" fill="#0c4a6e">nginx 路由（location）：</text>
  <text x="404" y="240" font-size="11" class="mono t">= /　·　^~ /assets/　　　　　　　　→ root /srv（靜態：client + WebLLM + 美術）</text>
  <text x="404" y="258" font-size="11" class="mono t">~ ^/(auth|wallet|save|records|leaderboard|entitlements|deposit) → yocat-office-backend-api:8080</text>
  <text x="404" y="276" font-size="11" class="mono t">^~ /character/　　　　　　　　　　→ yocat-character:3001（proxy_read_timeout 60s）</text>
  <text x="404" y="294" font-size="11" class="mono t">= /health　　　　　　　　　　　　 → yocat-character:3001/health（決定 client 引擎）</text>
  <text x="404" y="311" class="lbl mut">client 用同源相對路徑 → 全走此閘道 → 零 CORS</text>

  <!-- api -->
  <rect x="392" y="340" width="312" height="208" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="404" y="362" font-size="14" class="h" fill="#3730a3">② yocat-office-backend-api</text>
  <text x="404" y="380" class="lbl mono">Deployment ×2 · Service ClusterIP :8080</text>
  <text x="404" y="395" class="lbl mono">image …/api:local（Spring Modulith，7 BC）</text>
  <text x="404" y="410" class="lbl mono">manifest api-deployment.yaml / api-service.yaml</text>
  <text x="404" y="425" class="lbl mono">Dockerfile docker/api/Dockerfile（temurin-21-jre）</text>
  <text x="404" y="443" class="lbl">probe readiness /health/ready · liveness /health/live</text>
  <text x="404" y="458" class="lbl">preStop sleep5 · gracePeriod 60s · podAntiAffinity</text>
  <line x1="404" y1="466" x2="692" y2="466" stroke="#c7d2fe"/>
  <text x="404" y="483" class="lbl h" fill="#3730a3">envFrom（kustomization 產生）：</text>
  <text x="404" y="498" class="lbl mono">cm yocat-office-backend-api-config：DB_HOST=</text>
  <text x="404" y="511" class="lbl mono">yocat-pg.yocat.svc:5432 DB_NAME=yocat DB_USER=yocat</text>
  <text x="404" y="524" class="lbl mono">REDIS_HOST=redis REDIS_PORT=6379 SERVER_PORT=8080</text>
  <text x="404" y="539" class="lbl mono">secret …-api-secret：DB_PASSWORD / SESSION_SIGNING_KEY…</text>

  <!-- character -->
  <rect x="724" y="340" width="318" height="208" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="736" y="362" font-size="14" class="h" fill="#9a3412">③ yocat-character</text>
  <text x="736" y="380" class="lbl mono">Deployment ×1 · Service ClusterIP :3001</text>
  <text x="736" y="395" class="lbl mono">image …/character:local（node:20-alpine）</text>
  <text x="736" y="410" class="lbl mono">manifest character.yaml</text>
  <text x="736" y="425" class="lbl mono">原始碼 k8s/edge/character/server.js</text>
  <text x="736" y="440" class="lbl mut">（移植自 server/src/index.ts 的 /character/*）</text>
  <text x="736" y="457" class="lbl">probe tcpSocket :3001（不綁 vLLM）</text>
  <line x1="736" y1="465" x2="1030" y2="465" stroke="#fed7aa"/>
  <text x="736" y="482" class="lbl h" fill="#9a3412">env：</text>
  <text x="736" y="497" class="lbl mono">LLM_BASE=http://host.docker.internal:8000/v1</text>
  <text x="736" y="511" class="lbl mono">LLM_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ</text>
  <text x="736" y="525" class="lbl mono">LLM_TIMEOUT_MS=20000</text>
  <text x="736" y="541" class="lbl">端點 POST /character/{think,converse,chat,request,romance}·GET /health</text>

  <!-- redis -->
  <rect x="392" y="568" width="312" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="404" y="590" font-size="13" class="h" fill="#991b1b">④ redis</text>
  <text x="404" y="608" class="lbl mono">Deployment ×1 · Service ClusterIP :6379</text>
  <text x="404" y="623" class="lbl mono">manifest redis.yaml · image redis:7.2</text>
  <text x="404" y="640" class="lbl">rate-limit（BearerTokenFilter）/ 快取</text>

  <!-- flyway job -->
  <rect x="724" y="568" width="318" height="86" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="736" y="590" font-size="13" class="h" fill="#0f766e">⑤ flyway-migrate（Job，一次性）</text>
  <text x="736" y="608" class="lbl mono">image flyway/flyway:10-alpine args:migrate</text>
  <text x="736" y="623" class="lbl mono">manifest flyway-migration-job.yaml</text>
  <text x="736" y="640" class="lbl mono">mount cm flyway-migrations ← migrations/V001–V013</text>

  <!-- ingress note -->
  <rect x="392" y="674" width="650" height="52" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="404" y="696" font-size="12.5" class="h" fill="#854d0e">⑥ Ingress yocat-office-backend-local（Traefik）</text>
  <text x="404" y="714" class="lbl mono">host yocat-office-backend.local · path / → yocat-gateway:80 · manifest ingress.yaml</text>

  <!-- arrows inside cluster -->
  <line x1="470" y1="320" x2="470" y2="338" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="820" y1="320" x2="820" y2="338" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="334" class="lbl">會員路徑</text>
  <text x="840" y="334" class="lbl">/character · /health</text>
  <line x1="470" y1="548" x2="470" y2="566" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== HOST vLLM (outside cluster) ===== -->
  <rect x="1086" y="340" width="190" height="208" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1181" y="364" font-size="13" class="h" fill="#5b21b6" text-anchor="middle">🖥 Host（WSL Ubuntu）</text>
  <rect x="1102" y="394" width="158" height="140" rx="8" fill="#fff" stroke="#a78bfa"/>
  <text x="1181" y="416" font-size="13" class="h" fill="#5b21b6" text-anchor="middle">vLLM :8000</text>
  <text x="1181" y="436" class="lbl" text-anchor="middle">Qwen2.5-7B-Instruct-AWQ</text>
  <text x="1181" y="453" class="lbl" text-anchor="middle">OpenAI 相容 API</text>
  <text x="1181" y="472" class="lbl mono" text-anchor="middle">GET /v1/models</text>
  <text x="1181" y="488" class="lbl mono" text-anchor="middle">POST /v1/chat/</text>
  <text x="1181" y="502" class="lbl mono" text-anchor="middle">completions</text>
  <text x="1181" y="522" class="lbl mut" text-anchor="middle">本機 GPU 算力</text>

  <!-- character -> vLLM crossing cluster boundary -->
  <path d="M1042 470 C 1060 470, 1070 460, 1086 452" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arrP)"/>
  <text x="1050" y="430" font-size="10.5" class="h" fill="#7c3aed">host.docker</text>
  <text x="1052" y="444" font-size="10.5" class="h" fill="#7c3aed">.internal:8000</text>

  <!-- ===== postgres (ns yocat) ===== -->
  <rect x="1086" y="568" width="190" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1181" y="592" font-size="13" class="h" fill="#334155" text-anchor="middle">🗄 yocat-pg</text>
  <text x="1181" y="611" class="lbl" text-anchor="middle">PostgreSQL 16 · ns yocat</text>
  <text x="1181" y="628" class="lbl mono" text-anchor="middle">Service :5432 (NP 30432)</text>
  <text x="1181" y="646" class="lbl" text-anchor="middle">db=yocat user=yocat</text>
  <text x="1181" y="664" class="lbl mut" text-anchor="middle">schema-per-BC · Flyway 史表 platform</text>

  <!-- api -> postgres -->
  <path d="M704 500 C 900 500, 980 600, 1086 612" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="900" y="560" class="lbl">JDBC（DB_HOST/DB_PASSWORD）</text>
  <!-- flyway -> postgres -->
  <path d="M1042 626 C 1060 626, 1070 624, 1086 624" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- api -> redis -->
  <line x1="470" y1="548" x2="470" y2="566" stroke="#334155" stroke-width="1.8"/>

  <!-- ===== legend / flow order ===== -->
  <rect x="24" y="500" width="276" height="400" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="40" y="524" font-size="13.5" class="h t">主要流向（按序）</text>
  <text x="40" y="548" font-size="11.5" class="t">① 瀏覽器 →(:30088) gateway</text>
  <text x="40" y="568" font-size="11.5" class="t">② gateway 靜態回 client/assets</text>
  <text x="40" y="588" font-size="11.5" class="t">③ GET /health → character → vLLM</text>
  <text x="56" y="604" class="lbl">　200 up ⇒ client 走「後端模式」</text>
  <text x="40" y="624" font-size="11.5" class="t">④ /auth /wallet… → api → pg/redis</text>
  <text x="40" y="644" font-size="11.5" class="t">⑤ /character/* → character → vLLM</text>
  <text x="56" y="660" class="lbl">　（紫線＝跨出叢集打 host）</text>
  <text x="40" y="680" font-size="11.5" class="t">⑥ 背景 WebLLM 載好+probe → 切換</text>
  <text x="56" y="696" class="lbl">　之後 NPC 在瀏覽器生成，不再 ⑤</text>

  <text x="40" y="724" font-size="12.5" class="h t">一鍵部署指令</text>
  <text x="40" y="745" font-size="10" class="mono t">kubectl create ns yocat-office-backend-local</text>
  <text x="40" y="761" font-size="10" class="mono t">kubectl create configmap flyway-migrations \</text>
  <text x="48" y="774" font-size="10" class="mono t">--from-file=migrations/ -n &lt;ns&gt;</text>
  <text x="40" y="790" font-size="10" class="mono t">kubectl apply -k k8s/overlays/local/</text>
  <text x="40" y="806" font-size="10" class="mono t">kubectl rollout status deploy/... -n &lt;ns&gt;</text>

  <text x="40" y="832" font-size="12.5" class="h t">建置指令（dockerd 模式）</text>
  <text x="40" y="852" font-size="10" class="mono t">docker build -t …/api:local（apps/api jar）</text>
  <text x="40" y="866" font-size="10" class="mono t">docker build -t …/character:local k8s/edge/character</text>
  <text x="40" y="880" font-size="10" class="mono t">docker build -t …/gateway:local（staged ctx）</text>
  <text x="40" y="894" font-size="9.5" class="mut">※ nerdctl 不可用（無 buildkit）→ 用 docker build</text>
</svg>

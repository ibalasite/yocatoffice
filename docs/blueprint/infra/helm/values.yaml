# Generated by gendoc-gen-contracts from docs/EDD.md §3.5 / §3.6 + docs/ARCH.md §13
# Project: yocat-office-backend (Spring Modulith Modular Monolith, 7 BC)
# HA-First (Day1): >=2 replicas, HPA, PDB, no SPOF. Local-first = Rancher Desktop.

global:
  registry: "registry.sayyogames.internal"
  imageTag: "latest"          # Prod 以 git-sha8 覆寫（CI 產出）
  namespace: "yocat-office-backend-local"

image:
  repository: "registry.sayyogames.internal/yocat-office-backend"
  # Base image: eclipse-temurin:21-jre-alpine (EDD §3.5)
  tag: "latest"
  pullPolicy: IfNotPresent     # Local=nerdctl build；Prod=Always

# ── API Server（唯一對外發布服務；內含 7 個 Spring Modulith BC）──
api:
  name: yocat-office-backend-api
  replicaCount: 2              # HA 最低（§3.6.1 強制 Min Replicas >= 2，禁止 replicas: 1）
  containerPort: 8080

  resources:
    requests:
      cpu: "250m"             # Local/Dev（§3.5 環境矩陣）
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # ── 水平自動擴縮（§3.6.2 Auto-Scaling；不 scale to 0）──
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300   # scale down 冷卻 300s（§3.6.2）

  # ── Pod 中斷預算（§3.6.1 消除 API SPOF）──
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # ── 探針（對應 API GET /health/live、/health/ready）──
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

  # ── Graceful Shutdown（§3.6.5；in-flight 最多等 30s）──
  terminationGracePeriodSeconds: 40
  env:
    SERVER_SHUTDOWN: "graceful"
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"
    SPRING_MODULITH_EVENTS_JDBC_ENABLED: "true"

  # ── 反親和（分散到不同節點，消除節點級 SPOF）──
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: yocat-office-backend-api
            topologyKey: kubernetes.io/hostname

  service:
    type: ClusterIP
    port: 8080

# ── 資料層（Local 本機單節點例外，§3.7.2；Prod 為 Patroni Primary+Standby）──
postgresql:
  # Local 連既有 yocat namespace 的 PostgreSQL（§3.5；跨 namespace）
  external: true
  host: "yocat-pg.yocat.svc.cluster.local"
  port: 5432
  database: "yocat_office"
  # Prod: pg-primary.yocat-prod (Patroni VIP, 同步複本)
  ha:
    enabled: false            # Local=單節點；Prod 覆寫 true（Primary + 1 Standby）
    replicas: 1

redis:
  external: true
  host: "redis.yocat-office-backend-local.svc"
  port: 6379
  # Prod: redis-sentinel.yocat-prod (3 nodes)
  sentinel:
    enabled: false            # Prod 覆寫 true

# ── 可觀測性（§2.8 / API §17）──
observability:
  prometheus:
    enabled: true
    path: /actuator/prometheus
    port: 8080

# ── Secret（Local=SealedSecret / secrets.env 不提交；Prod=Vault/Sealed）──
secrets:
  provider: "sealed-secrets"
  prefix: "secret:yocat-office-backend/"
